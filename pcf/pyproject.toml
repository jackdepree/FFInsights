[project]
name = "pcf"
version = "0.1.0"
description = "PCF: Principal Component Football. In-house NFL analytics and forecasting."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=2.0.0",
    "nflreadpy>=0.1.5",
    "polars>=2.1.0",
    "requests>=2.34.2",
]

[project.scripts]
pcf = "pcf.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "nbstripout>=0.9.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcf"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network' --import-mode=importlib"
markers = ["network: needs the internet (skipped by default; run with -m network)"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Package code and tests only: not the docs (ruff also formats code inside Markdown) or explorations.
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
