  - id: voe
    name: VOE, value over expected
    phase: 1
    status: parked
    horizon: later
    cadence: [retrospective, in_season]  # open: the brief decides which cadence comes first (voe-retro / voe-live below)
    depends_on: [context-live, participation-late]
    origin: VOE_Model_Training.ipynb, VOE_Model_Prod.ipynb
    summary: "The CEO's pick, 2026-11-19 (\"I don't want to call it version 2, I just want to call it VOE\"): recreate the old VOE responsibly, map its gaps from machine learning, data science and causal angles, design sister and cousin models, and ask whether value over expected gives a reliable player value (plus-minus, wins above replacement, a causal contribution). Kickoff in projects/voe/BRIEF.md: the CEO's ask word for word, the usual way (nflWAR, plus-minus), analogies (basketball RAPM, gene knockouts), a close read of the old notebooks (ratings from a shared on-field leftover, slots from depth charts, a knockout to the slot average; defense's sign flipped; random splits), a map of eleven decisions and seven cousins, and the multiverse as the exploratory way to compare them. The CEO, 2026-11-19: explore all seven cousins, ranked; retro 2 waits until VOE and one or two cousins are done; hunches H69-H74. Explored 2026-11-19 (GO): most of any on-field value is the team (a player's number repeats 0.27 if he stays, 0.03 if he moves; plus-minus 0.07); QBs carry a team's next offense (+13.9%) and a whole game without the main QB costs 0.070 EPA a play; the old design repeats by construction and its slot model explains 0.0-0.2% of a held-out play. H69 held in part, H70 failed, H72 failed within a game, H73 failed; ideas I73 (games missed), I74 (plus-minus with a stats prior). The CEO, 2026-11-19: directions (a) and (b) together, H75 (\"90% confidence if we incorporate the plus minus sum\"), a small MLP beside the lasso. Second look 2026-11-20: H75 held in part (+7.8% on a team's next offense by its rule, no better than the plain plus-minus sum, +5.3% spanning 0 once the share of plays by new players is in the baseline; the knockout predicts a ninth of the missed-QB drop); the plus-minus sum carries the VOE model and the slots add nothing; the small MLP does worse than the lasso; I74 failed; idea I75 (roster continuity). The CEO, 2026-11-20: \"C, use missed games to size ratings\". Third look 2026-11-20: absences are measurable by position (main starters, whole games: QB -0.049 EPA a play, WR/OL/DL/LB/DB -0.011 to -0.021) and predict held-out games (+0.76%), but the ratings can't be sized from them (plus-minus doesn't track which absences hurt; the own-stats rating does for QBs only); I73 held in part. Paused by the CEO 2026-11-20 (\"i think we can pause voe right now ... EPA is too noisy per play\"): limitations L1-L8 in projects/voe/BRIEF.md wait for a workaround brainstorm; H76 (grouping plays with the same 22) failed a quick check (identical player values). Fourth look 2026-11-21 (the CEO's H89, success as the outcome): EPA beats success on both yardsticks (the roster-change test by 3.4 points; movers 0.08 against 0.05), and still wins when the target is next season's success; success values are more the team's (H89 failed)."

