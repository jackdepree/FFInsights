# PCF project registry: the single source of truth for every project's status and dependencies.
# docs/ROADMAP.md is the human-readable view. If they ever disagree, this file wins.
#
# Fields
#   id          unique kebab-case id; also the project's folder name: projects/<id>/
#   name        short human name
#   phase       0 foundation · 1 experts · 2 composites · 3 products · 4 automation · 5 public
#               (phases 0-3 are the layers in CLAUDE.md)
#   status      idea | exploring | brief | building | validating | done | parked | dead_end
#   horizon     now | next | later | parking   (omitted for dead_end)
#   cadence     phases 1-3 only. When the project updates, which also limits what inputs it may use:
#                 in_season        between games during the season; only data available live (DATA_SOURCES.md)
#                 retrospective    between seasons; may use post-season-only data (e.g. participation)
#                 offseason_events when offseason events land (combine, free agency, trades, draft)
#               A retrospective output may feed an in-season project only for seasons already finished
#               (e.g. last season's VOE as a prior), never for the season in progress. Each such edge
#               needs a stated reason in the consumer's brief. Reviewed so far: aging -> fantasy-projections,
#               aging -> dynasty-values (curves fit on completed seasons).
#   depends_on  ids this project needs first. "What does it feed?" is derived from these; never stored.
#   origin      optional: the old/ notebook it builds on
#   summary     one line
#   interface   added when status reaches done: the interface card from the project's RESULTS.md
#               (template: projects/_templates/RESULTS.md), so code and Claude can read it:
#                 inputs, outputs (path and quantities), grain, interval, cadence, known_at,
#                 model (pcf.<id> and champion version), how_to_use, feeds

projects:

  # ---------------------------------------------------------------- Phase 0: foundation
  - id: odds-collection
    name: Betting-line collection
    phase: 0
    status: exploring
    horizon: now
    depends_on: []
    summary: Collect game and player-prop lines weekly from free odds-API tiers and public JSON endpoints (no scraping). Time-sensitive, since every missed week is lost.

  - id: package-scaffold
    name: Package scaffold and config
    phase: 0
    status: done
    horizon: now
    depends_on: []
    summary: The pcf Python package, one central config (rule f), environment and test setup.
    interface:
      inputs: none
      outputs: pcf.config (get_config, zone, seasons, seed, get_secret), pcf.core.log (get_logger, setup_logging; masks keys), the pcf command (pcf info)
      grain: n/a
      interval: n/a
      cadence: n/a
      known_at: n/a
      model: none
      how_to_use: Import every path and setting from pcf.config, never hardcode one. Log through get_logger. Put code in the matching layer folder and follow its CLAUDE.md.
      feeds: every project

  - id: experiment-tracking
    name: Experiment tracking (MLflow)
    phase: 0
    status: idea
    horizon: now
    depends_on: [package-scaffold]
    summary: Local MLflow for every run and model, the pcf.<id> model registry with champion aliases, nested runs for the ladder, and registration allowed only after the blocking leakage checks pass.

  - id: data-layer
    name: Data layer
    phase: 0
    status: done
    horizon: now
    depends_on: [package-scaffold]
    summary: nflreadpy ingestion into a local cache kept out of git, with a re-runnable weekly refresh.
    interface:
      inputs: nflverse-data and ffopportunity GitHub releases, dynastyprocess ECR and id-map files (36 datasets)
      outputs: raw/nflverse (latest files, manifest, change logs for state files), pcf.data.sources.nflverse (refresh, scan, snapshot, data_version, DATASETS), the pcf refresh command, the snapshot-nflverse Actions job (state change logs into pcf-data daily)
      grain: as published (one file per dataset per season, or one file total)
      interval: on demand; state files daily via Actions
      cadence: n/a
      known_at: n/a (raw files carry no known_at; timeline adds it). Manifest rows record when each file was fetched.
      model: none
      how_to_use: Read through scan(dataset, seasons) a season at a time, and snapshot(dataset, at) for state files as of a moment. Only timeline, cleaning-port and the tables read sources; experts never do. Log data_version() with every run.
      feeds: timeline, cleaning-port, experiment-tracking

  - id: timeline
    name: NFL timeline and known-at timestamps
    phase: 0
    status: done
    horizon: now
    depends_on: [data-layer]
    summary: One calendar for season weeks and offseason phases (combine, free agency, trades, pre-/post-draft, camp). Every row gets a known_at timestamp. Fallback is "week 0" only if this proves unworkable.
    interface:
      inputs: standardized schedules, the offseason dates file (src/pcf/data/timeline/offseason_dates.csv), each dataset's own timestamps (date_modified, dt, trade_date, scrape_date)
      outputs: pcf.data.timeline. calendar(schedules) -> Calendar (games with kickoff, weeks, phases, offseason); phase_at(cal, moment); team_kickoffs(games); known_at(dataset, df, cal, fetched_at) and RULES for all 36 nflverse datasets; check_known_at(df, not_before)
      grain: games, season-weeks, phases; rules keep each dataset's rows
      interval: 1999 to the current schedule
      cadence: n/a (pure functions; rebuild the calendar after each schedules refresh)
      known_at: defined here. Schedules get facts_known_at, lines_known_at and known_at.
      model: none
      how_to_use: Build the calendar once from standard.schedules. Add known_at to every table with known_at(dataset, df, cal); pass fetched_at for state files and unfinished season totals. Add next league year's row to the dates file each spring (a test fails from February 1).
      feeds: grain-tables, validation-harness, cleaning-port, offseason experts

  - id: cleaning-port
    name: Port the cleaning functions
    phase: 0
    status: done
    horizon: now
    depends_on: [data-layer]
    origin: VOE_Model_Training.ipynb, Fatigue_Model_Training.ipynb (pivot_wide_both_sides, clean_depth_charts, pivot_long_both_sides, get_position_groups)
    summary: Copy the old play-by-play, depth-chart, injury and snap cleaning functions into the package, prove they match the old output with golden tests, then improve them one tested change at a time (docs/OLD_INVENTORY.md).
    interface:
      inputs: raw nflverse play-by-play, participation, depth charts (weekly and daily), weekly rosters, schedules, player stats, ff_opportunity, snap counts, players, injuries
      outputs: pure functions in pcf.data.clean. players (plays_with_players, players_on_play), depth_charts (weekly_depth_rows, daily_depth_rows with timeline.team_kickoffs, depth_labels), slots (slot_labels adds position, position_label, label_source; position_groups, position_of), standard (one function per source; team, standard_teams), legacy (faithful copy, for comparison only)
      grain: slot labels player-play; depth labels player-team-week; standard functions as published
      interval: depth labels weekly from 2001; slot labels from 2016 (participation)
      cadence: slot labels from participation are retrospective only; depth labels are usable in season (each week uses only that week's chart and earlier)
      known_at: none yet (timeline). Depth labels are known at that week's chart, or the daily snapshot's dt.
      model: none
      how_to_use: Called by grain-tables, never by experts. Standardize each source first (standard), build depth labels for all seasons at once, then slot_labels a season at a time. Filter on label_source for chart-listed players only.
      feeds: grain-tables

  - id: grain-tables
    name: Tables at every level of detail
    phase: 0
    status: brief
    horizon: now
    depends_on: [cleaning-port, timeline]
    summary: Play, player-game, team-game, player-week, player-season, team-season, player-career and event tables, joined by shared ids and known_at.

  - id: tag-tables
    name: Tag tables
    phase: 0
    status: idea
    horizon: now
    depends_on: [grain-tables]
    summary: Reusable categorical labels per play and per player-game (successful_play, added_win_probability, risky_play, ...) that any project can add to.

  - id: validation-harness
    name: Validation harness
    phase: 0
    status: idea
    horizon: now
    depends_on: [package-scaffold, timeline, experiment-tracking]
    summary: The as_of gateway's leakage suite (docs/ARCHITECTURE.md), walk-forward backtests, calibration, uncertainty checks, shuffled-null signal tests, feature selection inside CV folds.

  - id: baselines
    name: Dumb baselines
    phase: 0
    status: idea
    horizon: now
    depends_on: [grain-tables, validation-harness]
    summary: Rolling averages, Vegas lines, ECR and a simple lasso. The yardstick every product must beat.

  - id: prediction-ledger
    name: Prediction ledger
    phase: 0
    status: idea
    horizon: now
    depends_on: [package-scaffold]
    summary: An append-only record of every prediction made before kickoff, with the market line at that time. It feeds the track record and the scorecards.

  - id: registry-tooling
    name: Registry tooling
    phase: 0
    status: idea
    horizon: now
    depends_on: [package-scaffold]
    summary: Validates this file (no missing ids, no cycles, inputs match depends_on), draws the impact map, and generates projects/KNOWLEDGE.md from every RESULTS.md.

  # ---------------------------------------------------------------- Phase 1: experts
  - id: elo
    name: Team Elo (weekly)
    phase: 1
    status: idea
    horizon: next
    cadence: [in_season]
    depends_on: [grain-tables, validation-harness]
    summary: Weekly team strength rating, with optional offense/defense split and QB adjustment. Doubles as a win-probability baseline.

  - id: team-efficiency
    name: Opponent-adjusted efficiency
    phase: 1
    status: idea
    horizon: next
    cadence: [in_season]
    depends_on: [grain-tables, validation-harness]
    summary: Offense and defense EPA per play adjusted for schedule strength (a free analog of DVOA).

  - id: pace
    name: Pace and play-calling
    phase: 1
    status: idea
    horizon: next
    cadence: [in_season]
    depends_on: [grain-tables, validation-harness]
    summary: Neutral pace, pass rate over expected and no-huddle rate, the drivers of fantasy volume.

  - id: environment
    name: Environment
    phase: 1
    status: idea
    horizon: next
    cadence: [in_season]
    depends_on: [grain-tables, validation-harness]
    summary: Weather, roof, surface, rest days, travel and time zones.

  - id: stabilization
    name: Stabilization and regression
    phase: 1
    status: idea
    horizon: next
    cadence: [in_season]
    depends_on: [grain-tables, validation-harness]
    summary: How many attempts until a rate is real, and shrinking noisy rates toward the mean. The base of player-level uncertainty.

  - id: context-live
    name: Context (in-season)
    phase: 1
    status: idea
    horizon: next
    cadence: [in_season]
    depends_on: [grain-tables, tag-tables, validation-harness]
    origin: Context_Model_Training.ipynb
    summary: The situation and pressure each play happened in, using only fields available during the season (play-by-play, lagged FTN charting, weekly NGS and PFR). Updates between games.

  - id: context-retro
    name: Context (retrospective)
    phase: 1
    status: idea
    horizon: later
    cadence: [retrospective]
    depends_on: [grain-tables, tag-tables, validation-harness]
    origin: Context_Model_Training.ipynb
    summary: The fuller context model, built on post-season participation (routes, coverage, pressure, time to throw). Refactored from the old context models. Updates between seasons.

  - id: participation
    name: Participation and snaps
    phase: 1
    status: idea
    horizon: next
    cadence: [in_season]
    depends_on: [grain-tables, validation-harness]
    summary: Snaps, routes run and share of plays, projected forward. Live from snap counts and daily depth charts. Play-level participation (routes) is available for training only.

  - id: line-play
    name: Line play
    phase: 1
    status: idea
    horizon: later
    cadence: [in_season]
    depends_on: [grain-tables, tag-tables, validation-harness]
    summary: Pass protection and run blocking as a unit (pressure over expected, yards before contact).

  - id: game-script
    name: Game script
    phase: 1
    status: idea
    horizon: later
    cadence: [in_season]
    depends_on: [elo, team-efficiency, pace]
    summary: How likely each team is to be leading or trailing during the game, which shifts the pass/run mix.

  - id: voe-retro
    name: VOE (retrospective)
    phase: 1
    status: idea
    horizon: later
    cadence: [retrospective]
    depends_on: [context-retro]
    origin: VOE_Model_Training.ipynb
    summary: Value over expected for each player at the play level, rebuilt from the old VOE model on post-season participation. PCF's signature stat. Updates between seasons, and also serves as a prior for the next season.

  - id: voe-live
    name: VOE (in-season)
    phase: 1
    status: idea
    horizon: later
    cadence: [in_season]
    depends_on: [context-live]
    summary: Value over expected updated between games during the season, using only live-available fields. Feeds weekly composites.

  - id: opportunity-quality
    name: Opportunity quality
    phase: 1
    status: idea
    horizon: later
    cadence: [in_season]
    depends_on: [participation]
    summary: Expected fantasy points from where targets and carries happen.

  - id: vacated-opportunity
    name: Vacated opportunity
    phase: 1
    status: idea
    horizon: later
    cadence: [in_season]
    depends_on: [participation, opportunity-quality]
    summary: When a player is out, who absorbs his targets and carries.

  - id: td-expert
    name: Touchdown expert
    phase: 1
    status: idea
    horizon: later
    cadence: [in_season]
    depends_on: [opportunity-quality, team-efficiency]
    summary: Red-zone and goal-line usage, giving touchdown probability. Feeds TD-scorer props.

  - id: aging
    name: Aging curves
    phase: 1
    status: idea
    horizon: later
    cadence: [retrospective]
    depends_on: [grain-tables, validation-harness]
    summary: Decline by position and age. Curves are fit between seasons; in-season projects use curves fit on completed seasons only.

  - id: injury-fatigue
    name: Injury and fatigue
    phase: 1
    status: idea
    horizon: later
    cadence: [in_season]
    depends_on: [participation, timeline]
    origin: Fatigue_Model_Training.ipynb
    summary: Workload, injury-risk tiers (not "he'll get hurt") and recovery.

  - id: roles-archetypes
    name: Roles and archetypes
    phase: 1
    status: idea
    horizon: later
    cadence: [in_season, retrospective]
    depends_on: [participation]
    summary: Slot receiver, deep threat, receiving back, blocking tight end, ... from usage patterns. Weekly from snap counts and depth charts; refined between seasons with route data.

  - id: schemes-v2
    name: Schemes v2
    phase: 1
    status: idea
    horizon: later
    cadence: [retrospective]
    depends_on: [roles-archetypes, context-retro]
    origin: Schemes_Model.ipynb
    summary: A full expert (CEO call, 2026-10-28). Retry team schemes from the roles-and-archetypes angle; the exploration must first check why schemes-v1 found little signal.

  - id: qb-talent
    name: QB true talent
    phase: 1
    status: idea
    horizon: later
    cadence: [in_season]
    depends_on: [context-live, stabilization]
    summary: Completion over expected, sack avoidance and play under pressure, shrunk for sample size.

  - id: prospects
    name: Prospects and rookies
    phase: 1
    status: idea
    horizon: later
    cadence: [offseason_events]
    depends_on: [timeline, validation-harness]
    summary: College stats, combine and draft capital, giving rookie projections. Key for dynasty and the offseason.

  - id: kicker-dst
    name: Kicker and DST
    phase: 1
    status: idea
    horizon: later
    cadence: [in_season]
    depends_on: [team-efficiency, environment]
    summary: Needed for fantasy completeness.

  - id: market
    name: Market expert
    phase: 1
    status: idea
    horizon: later
    cadence: [in_season]
    depends_on: [odds-collection, timeline]
    summary: Implied team totals and line movement, as features.

  - id: crowd
    name: Crowd expert
    phase: 1
    status: idea
    horizon: later
    cadence: [in_season, offseason_events]
    depends_on: [grain-tables, timeline]
    summary: ECR and ADP as features and benchmarks. Where we disagree with the crowd is where an edge might be.

  - id: news
    name: News and off-field
    phase: 1
    status: idea
    horizon: later
    cadence: [in_season]
    depends_on: [timeline, validation-harness]
    summary: Arrests, coach quotes and media framing from free sources (RSS, Reddit, team sites). Weakest free data, so it comes last.

  # ---------------------------------------------------------------- Phase 2: composites
  - id: team-strength
    name: Team strength composite
    phase: 2
    status: idea
    horizon: later
    cadence: [in_season]
    depends_on: [elo, team-efficiency, qb-talent, line-play]
    summary: One team-strength view combining the team experts.

  - id: player-opportunity
    name: Player opportunity composite
    phase: 2
    status: idea
    horizon: later
    cadence: [in_season]
    depends_on: [participation, opportunity-quality, vacated-opportunity, roles-archetypes, injury-fatigue]
    summary: Projected volume and role for each player for the coming game.

  - id: game-simulator
    name: Game simulator
    phase: 2
    status: idea
    horizon: later
    cadence: [in_season]
    depends_on: [team-strength, player-opportunity, game-script, pace, environment, voe-live, td-expert, stabilization, market]
    summary: Drive- or play-level simulation run thousands of times. Joint distributions for every prop, fantasy score and correlation from one engine.

  - id: outcome-distributions
    name: Outcome distributions
    phase: 2
    status: idea
    horizon: later
    cadence: [in_season]
    depends_on: [game-simulator]
    summary: Floor, median and ceiling for every player and stat.

  # ---------------------------------------------------------------- Phase 3: products
  - id: fantasy-projections
    name: Fantasy projections (all formats)
    phase: 3
    status: idea
    horizon: later
    cadence: [in_season]
    depends_on: [outcome-distributions, aging, prospects, crowd, kicker-dst]
    summary: Projections with uncertainty for any scoring (PPR, half, custom) and format.

  - id: start-sit
    name: Start/sit
    phase: 3
    status: idea
    horizon: later
    cadence: [in_season]
    depends_on: [fantasy-projections]
    summary: Weekly start/sit advice with confidence grades.

  - id: props-board
    name: Props board
    phase: 3
    status: idea
    horizon: later
    cadence: [in_season]
    depends_on: [outcome-distributions, odds-collection, prediction-ledger]
    summary: Our probability against the line for every collected prop, ranked by edge and confidence.

  - id: dfs-bestball
    name: DFS and best ball
    phase: 3
    status: idea
    horizon: later
    cadence: [in_season]
    depends_on: [outcome-distributions]
    summary: Ceiling-focused rankings and stacks.

  - id: dynasty-values
    name: Dynasty values
    phase: 3
    status: idea
    horizon: later
    cadence: [in_season, offseason_events]
    depends_on: [fantasy-projections, aging, prospects]
    summary: Multi-year player values.

  - id: futures
    name: Futures
    phase: 3
    status: idea
    horizon: later
    cadence: [in_season, offseason_events]
    depends_on: [game-simulator]
    summary: Season-long simulations for win totals, playoffs and Super Bowl odds.

  - id: scorecards
    name: Scorecards and track record
    phase: 3
    status: idea
    horizon: later
    cadence: [in_season]
    depends_on: [prediction-ledger, validation-harness]
    summary: Which models make or lose money, which are erratic, with uncertainty on our own performance.

  - id: weekly-report
    name: Weekly HTML report
    phase: 3
    status: idea
    horizon: later
    cadence: [in_season]
    depends_on: [start-sit, props-board, scorecards]
    summary: The user view from VISION.md, in layers of depth.

  - id: builder-view
    name: Builder view
    phase: 3
    status: idea
    horizon: later
    cadence: [in_season]
    depends_on: [registry-tooling]
    summary: Project status, the impact map and exploration results, the builder view from VISION.md.

  # ---------------------------------------------------------------- Phase 4: automation & distribution
  - id: weekly-run
    name: Automated weekly run
    phase: 4
    status: idea
    horizon: later
    cadence: [in_season]
    depends_on: [weekly-report]
    summary: The whole pipeline runs on a schedule, end to end, on the CEO's PC via Windows Task Scheduler (Tue, Wed, Sat; docs/ARCHITECTURE.md).

  - id: email-reports
    name: Emailed reports
    phase: 4
    status: idea
    horizon: later
    cadence: [in_season]
    depends_on: [weekly-report, weekly-run]
    summary: The weekly report emailed to the CEO and friends.

  - id: dashboard
    name: Dashboard
    phase: 4
    status: idea
    horizon: later
    cadence: [in_season]
    depends_on: [weekly-report]
    summary: Interactive version of the report.

  # ---------------------------------------------------------------- Phase 5: public
  - id: website
    name: Public website
    phase: 5
    status: idea
    horizon: later
    cadence: [in_season]
    depends_on: [dashboard, scorecards]
    summary: Subscriptions, only once the track record earns it.

  # ---------------------------------------------------------------- Parking lot
  - id: play-caller
    name: Play-caller tendencies
    phase: 1
    status: parked
    horizon: parking
    cadence: [in_season]
    depends_on: [pace]
    summary: 4th-down aggressiveness and pass rate tied to the coach, following him across teams.

  - id: referee-crews
    name: Referee crews
    phase: 1
    status: parked
    horizon: parking
    cadence: [in_season]
    depends_on: [grain-tables]
    summary: Penalty and flag tendencies by crew.

  - id: coverage-matchups
    name: Coverage matchups
    phase: 1
    status: parked
    horizon: parking
    cadence: [retrospective]
    depends_on: [roles-archetypes]
    summary: Receiver performance against man vs. zone coverage (limited free charting data).

  - id: contract-motivation
    name: Contract and motivation
    phase: 1
    status: parked
    horizon: parking
    cadence: [offseason_events]
    depends_on: [timeline]
    summary: Contract years, incentives and extension likelihood.

  - id: hot-hand
    name: Hot hand (exploration only)
    phase: 1
    status: parked
    horizon: parking
    cadence: [in_season]
    depends_on: [validation-harness]
    summary: Does momentum exist beyond noise? Mainly a test that the shuffled-null check works.

  - id: voe-diffusion
    name: VOE as a conditional diffusion model
    phase: 1
    status: parked
    horizon: parking
    cadence: [retrospective]
    depends_on: [voe-retro]
    summary: CEO idea. Revisit once VOE (retrospective) gives a baseline to beat.

  # ---------------------------------------------------------------- Dead ends
  - id: schemes-v1
    name: Schemes v1
    phase: 1
    status: dead_end
    depends_on: []
    origin: Schemes_Model.ipynb
    summary: Over-expectation features, then PCA, then clustering into team schemes. Little usable signal found. Retried as schemes-v2.
