  - id: context-live
    name: Context (in-season)
    phase: 1
    status: done
    horizon: next
    cadence: [in_season]
    depends_on: [grain-tables, tag-tables, validation-harness, schemes-v2, participation-late]
    origin: Context_Model_Training.ipynb
    summary: "The play-outcome forecaster (the CEO's design, 2026-11-16; hunches H63-H66): for every play, what the situation and both sides' calls say should happen, with nothing known about who the players are, so later experts credit players only with the difference. Explored 2026-11-16 (GO): the live call fields (play-by-play and FTN, 2022 on) add clearly to the situation for pressure (0.8% to 4.2% of squared error), time to throw (1.7% to 17.6%), depth of target (4.3% to 18.1%), completion (1.5% to 3.9%) and sack; about half a point for runs and for how a play ends; nothing explains interceptions or fumbles. The two sides' calls add up with no extra from the combination. A blitz isn't charted on runs. Players differ in context by about 1 point of success rate. The after-the-season fields changed provider in 2023 and belong to context-retro (projects/context-live/EXPLORATION.md). The CEO's calls, 2026-11-16: interceptions, fumbles and scrambles left out; screens and play action count as calls; each outcome must beat the situation-only model; schemes-v2's traits are allowed as inputs (how a team plays, not how well). Every play is covered, runs included. Brief agreed 2026-11-16; the build runs in its own session. Built 2026-11-17 (RESULTS.md, decision 0036): one model per outcome, 17 outcomes, its own post-game runner; the calls beat the situation alone by more than the fitting noise for 12 (time to throw 12.0% of the loss, depth of target 10.5%, pressure 2.8%, sack 2.5%, completion 2.1%; runs 0.2% to 0.9%); the situation alone ships for a stuffed run, a run's first down and touchdown, a dropback's touchdown and penalties. All beat 20 of 20 of both nulls; calibrated (sack and explosive pass recalibrated); ranges 79% to 82%. Traits never beat the calls; the two sides add up (H65); players' context spreads 0.7 points of success rate (H66); the on-field map's personnel leaks and is left out. Champion v1 registered 2026-11-17 (run 72a7e2e3), the vault (2025) holds. The CEO, 2026-11-19: spot-check of the on-field map's leak done (R18: even the true personnel adds nothing beyond the calls; idea I63 killed); plays like this one kept as a non-default output, \"I think that can be very powerful in the future for a feature for downstream models. So I would say keep it\"; a defense's steadier calls logged as idea I71, to revisit through schemes; \"I don't have any vetoes\"; \"I think it's good for approval to merge\". The football sanity lists' reaction is pending (two questions checked: R16, R17). Back-history 2017-2024 for six outcomes in two editions, situation and calls16 (retrospective), for skill-over-expected's H84 (decision 0038; runs ebe22dcf and b68c042b; `pcf.experts.context_live.back`); the champion is unchanged."
    interface:
      inputs: "play.pbp and play.ftn (in-season view), play.participation (retrospective view; pressure and time to throw as outcomes only, from 2023), team_season.charted (tried, not shipped); participation-late's history run 2a30b3e5 for the player context"
      outputs: "outputs/context-live/<run_id>/history.parquet: the standard schema keyed game_id, play_id; one row per play and outcome; quantity the outcome (rush_yards_exp, run_stuffed_prob, run_explosive_prob, run_success_prob, run_first_down_prob, run_td_prob, pressure_prob, sack_prob, time_to_throw_exp, dropback_yards_exp, pass_explosive_prob, dropback_success_prob, dropback_first_down_prob, dropback_td_prob, air_yards_exp, completion_prob, penalty_prob); mean the chance or expected value, q10-q90 its range (equal to the chance for a chance); model_version the shipped rung. Beside it player_game.parquet and team_game.parquet (ctx_success, ctx_success_sit, ctx_calls). live.parquet from the champion (run live --version N). Not the default, beside them: neighbours_history.parquet (2023-2025) and neighbours_live.parquet (2026), the same schema and quantities from the 300 most similar earlier plays (plays like this one, model_version plays-like-this-k300; decision 0036, call 20)"
      grain: play (designed runs, dropbacks, pass attempts, every snap, per outcome); player-game and team-game for the context
      interval: every scrimmage play, 2023-2024 walk-forward (pressure and time to throw 2024), 2025 from the vault run, 2026 from the champion
      cadence: in_season (post-game)
      known_at: the first weekly run at least 14 days after kickoff (FTN's known-at), as participation-late
      model: "per outcome, the shipped rung of decision 0036: live call fields with trees or logistic/ridge, or the situation alone; Platt-recalibrated for sack and explosive pass; yards clipped to the field"
      how_to_use: "What the context expected on a play: credit players and teams with actual minus expected. Train only on the walk-forward history (rule e). Known two weeks after the game, so never an input to a forecast before that game. Plays like this one is weaker than the default for every outcome (R8): show it for the story, not as the forecast. It is a downstream feature candidate (the CEO, 2026-11-19): its outcomes come from the same plays, so they agree with each other"
      feeds: voe-live, play attribution, qb-talent, line-play, the game simulator's play model, the yardstick (crude-forecaster)
  - id: context-retro
    name: Context (retrospective)
    phase: 1
    status: validating
    horizon: next
    cadence: [retrospective]
    depends_on: [grain-tables, validation-harness, context-live]
    origin: Context_Model_Training.ipynb
    summary: Schemes-v2's retrospective traits (team_season.charted) are a planned input (CEO, 2026-11-10). The fuller context model, built on post-season participation (routes, coverage, pressure, time to throw). Refactored from the old context models. Updates between seasons. 2026-11-21, brief agreed in projects/context-v2/BRIEF.md (its last section), the chain of boosted trees before the snap and given the real pressure, coverage as an input, and the blame split (each sack's pressure part and after-pressure part) summed by player; for the build chat. Building 2026-11-21 (projects/context-retro/BUILD.md, decision 0040); the brief is linked, not copied.

  - id: context-v2
    name: Context, the next version (methods and information)
    phase: 1
    status: brief
    horizon: next
    cadence: [in_season, retrospective]  # open: the brief decides; the after-the-season fields belong to context-retro (rule m)
    depends_on: [context-live]
    summary: "The CEO's kickoff, 2026-11-20, after skill-over-expected's H84: \"I am just disappointed that this expert can only explain 1 to 4% of the variance for these outcomes.\" Hunches H85 to H88 (a conditional diffusion model for all outcomes at once; conditioning on a play's own outcomes; play action and quick passing as strategy; gains carried downstream) and question I93 (propensity models). The CEO's test: \"judged on each outcome and how well it can fit to that outcome\". Draft brief in projects/context-v2/BRIEF.md. The CEO's odds: H85 25%, H86 75%, H87 75%, H88 50%; method A first, routes and coverage in scope. First look 2026-11-20 (trees, 2023 to 2024): before the snap the yes-or-no outcomes stay at 1 to 5% even with coverage (coverage adds about 1 point for completion and depth); given a real pressure, sack's share goes from 1.2% to 16.8% (H86 held); an offense's quick-pass rate over expected repeats 0.70 and 0.68 (H87 held); the chain adds nothing before the snap; participation's route is only the target's. Second look 2026-11-20: the CEO's conditional diffusion model is clearly worse than the trees on all six outcomes on the same plays (2% to 10% of their loss; sack chances badly calibrated); it learns the play's shape, but the chain gets the shape and the rates (H85 failed). Third look 2026-11-20 (I95): an offense's quick-pass rate doesn't forecast its next game's sacks or pressure (sacks -1.5%, its weight flips sign; I95 failed); its time to throw to date adds 2.8% to next game's pressure; a game's sack rate is at most 23% forecastable. Fourth look 2026-11-21 (I94, the blame split): what happens after a pressure is the QB's (kept 101%, linemen 4%); the pressure is half the QB's (47%) and the rest the team's; with a sack counted as a pressure (empty on sacks before 2023), sacks per pressure is a QB trait (kept 107%). Build section drafted 2026-11-21 (BRIEF.md): context-retro as the chain, before the snap and given the pressure, with the split; for the CEO to agree. Brief agreed 2026-11-21 (the CEO: \"I do not veto anything in the brief. Merge approved\"); the build is context-retro."

