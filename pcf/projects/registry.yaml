# PCF project registry: the single source of truth for every project's status and dependencies.
# docs/ROADMAP.md is the human-readable view. If they ever disagree, this file wins.
#
# Fields
#   id          unique kebab-case id; also the project's folder name: projects/<id>/
#   name        short human name
#   phase       0 foundation · 1 experts · 2 composites · 3 products · 4 automation · 5 public
#               (phases 0-3 are the layers in CLAUDE.md)
#   status      idea | exploring | brief | building | validating | done | parked | dead_end
#   horizon     now | next | later | parking   (omitted for dead_end)
#   cadence     phases 1-3 only. When the project updates, which also limits what inputs it may use:
#                 in_season        between games during the season; only data available live (DATA_SOURCES.md)
#                 retrospective    between seasons; may use post-season-only data (e.g. participation)
#                 offseason_events when offseason events land (combine, free agency, trades, draft)
#               A retrospective output may feed an in-season project only for seasons already finished
#               (e.g. last season's VOE as a prior), never for the season in progress. Each such edge
#               needs a stated reason in the consumer's brief. Reviewed so far: aging -> fantasy-projections,
#               aging -> dynasty-values (curves fit on completed seasons).
#   depends_on  ids this project needs first. "What does it feed?" is derived from these; never stored.
#   origin      optional: the old/ notebook it builds on
#   summary     one line
#   interface   added when status reaches done: the interface card from the project's RESULTS.md
#               (template: projects/_templates/RESULTS.md), so code and Claude can read it:
#                 inputs, outputs (path and quantities), grain, interval, cadence, known_at,
#                 model (pcf.<id> and champion version), how_to_use, feeds
#   champion    models only: the version of pcf.<id> the weekly run uses. Changed only on a branch
#               and merged with the CEO's approval; `pcf champions` copies it to MLflow (decision 0009)

projects:

  # ---------------------------------------------------------------- Phase 0: foundation
  - id: odds-collection
    name: Betting-line collection
    phase: 0
    status: building
    horizon: now
    depends_on: []
    summary: Collect game and player-prop lines weekly from free odds-API tiers and public JSON endpoints (no scraping). Time-sensitive, since every missed week is lost.

  - id: package-scaffold
    name: Package scaffold and config
    phase: 0
    status: done
    horizon: now
    depends_on: []
    summary: The pcf Python package, one central config (rule f), environment and test setup.
    interface:
      inputs: none
      outputs: pcf.config (get_config, zone, seasons, seed, get_secret), pcf.core.log (get_logger, setup_logging; masks keys), the pcf command (pcf info)
      grain: n/a
      interval: n/a
      cadence: n/a
      known_at: n/a
      model: none
      how_to_use: Import every path and setting from pcf.config, never hardcode one. Log through get_logger. Put code in the matching layer folder and follow its CLAUDE.md.
      feeds: every project

  - id: experiment-tracking
    name: Experiment tracking (MLflow)
    phase: 0
    status: done
    horizon: now
    depends_on: [package-scaffold]
    summary: Local MLflow for every run and model, the pcf.<id> model registry with champion aliases, nested runs for the ladder, and registration allowed only after the blocking leakage checks pass.
    interface:
      inputs: pcf.config (mlflow zone, REGISTRY_FILE, UV_LOCK), registry.yaml (ids, cadence, champion), git
      outputs: "pcf.core.tracking: attempt, rung (.takeaways), log_model, log_checks, register, set_challenger, sync_champions, alias_version, load_model, versions_tried, mark_vault_opened, use_store, experiment. pcf.core.registry: projects, project. Commands pcf ui and pcf champions. Store data/mlflow/mlflow.db and data/mlflow/artifacts/<id>/."
      grain: one run per attempt and per rung; one registered model per project
      interval: from 2026-11-01
      cadence: n/a (used whenever a model trains)
      known_at: n/a; runs record train_end, the last known_at in their training data
      model: none
      how_to_use: Train inside tracking.attempt(id, train_end=...) with one tracking.rung("<n>-<method>") per rung; log_model and takeaways in each rung. The harness calls log_checks and register. To change a champion, write champion N under the project in registry.yaml on the branch; after the CEO merges, run pcf champions on main.
      feeds: validation-harness, every modelling project, weekly-run, scorecards

  - id: data-layer
    name: Data layer
    phase: 0
    status: done
    horizon: now
    depends_on: [package-scaffold]
    summary: nflreadpy ingestion into a local cache kept out of git, with a re-runnable weekly refresh.
    interface:
      inputs: nflverse-data and ffopportunity GitHub releases, dynastyprocess ECR and id-map files (36 datasets)
      outputs: raw/nflverse (latest files, manifest, change logs for state files), pcf.data.sources.nflverse (refresh, scan, snapshot, data_version, DATASETS), the pcf refresh command, the snapshot-nflverse Actions job (state change logs into pcf-data daily)
      grain: as published (one file per dataset per season, or one file total)
      interval: on demand; state files daily via Actions
      cadence: n/a
      known_at: n/a (raw files carry no known_at; timeline adds it). Manifest rows record when each file was fetched.
      model: none
      how_to_use: Read through scan(dataset, seasons) a season at a time, and snapshot(dataset, at) for state files as of a moment. Only timeline, cleaning-port and the tables read sources; experts never do. Log data_version() with every run.
      feeds: timeline, cleaning-port, experiment-tracking

  - id: timeline
    name: NFL timeline and known-at timestamps
    phase: 0
    status: done
    horizon: now
    depends_on: [data-layer]
    summary: One calendar for season weeks and offseason phases (combine, free agency, trades, pre-/post-draft, camp). Every row gets a known_at timestamp. Fallback is "week 0" only if this proves unworkable.
    interface:
      inputs: standardized schedules, the offseason dates file (src/pcf/data/timeline/offseason_dates.csv), each dataset's own timestamps (date_modified, dt, trade_date, scrape_date)
      outputs: pcf.data.timeline. calendar(schedules) -> Calendar (games with kickoff, weeks, phases, offseason); phase_at(cal, moment); team_kickoffs(games); known_at(dataset, df, cal, fetched_at) and RULES for all 36 nflverse datasets; check_known_at(df, not_before)
      grain: games, season-weeks, phases; rules keep each dataset's rows
      interval: 1999 to the current schedule
      cadence: n/a (pure functions; rebuild the calendar after each schedules refresh)
      known_at: defined here. Schedules get facts_known_at, lines_known_at and known_at.
      model: none
      how_to_use: Build the calendar once from standard.schedules. Add known_at to every table with known_at(dataset, df, cal); pass fetched_at for state files and unfinished season totals. Add next league year's row to the dates file each spring (a test fails from February 1).
      feeds: grain-tables, validation-harness, cleaning-port, offseason experts

  - id: cleaning-port
    name: Port the cleaning functions
    phase: 0
    status: done
    horizon: now
    depends_on: [data-layer]
    origin: VOE_Model_Training.ipynb, Fatigue_Model_Training.ipynb (pivot_wide_both_sides, clean_depth_charts, pivot_long_both_sides, get_position_groups)
    summary: Copy the old play-by-play, depth-chart, injury and snap cleaning functions into the package, prove they match the old output with golden tests, then improve them one tested change at a time (docs/OLD_INVENTORY.md).
    interface:
      inputs: raw nflverse play-by-play, participation, depth charts (weekly and daily), weekly rosters, schedules, player stats, ff_opportunity, snap counts, players, injuries
      outputs: pure functions in pcf.data.clean. players (plays_with_players, players_on_play), depth_charts (weekly_depth_rows, daily_depth_rows with timeline.team_kickoffs, depth_labels), slots (slot_labels adds position, position_label, label_source; position_groups, position_of), standard (one function per source; team, standard_teams), legacy (faithful copy, for comparison only)
      grain: slot labels player-play; depth labels player-team-week; standard functions as published
      interval: depth labels weekly from 2001; slot labels from 2016 (participation)
      cadence: slot labels from participation are retrospective only; depth labels are usable in season (each week uses only that week's chart and earlier)
      known_at: none yet (timeline). Depth labels are known at that week's chart, or the daily snapshot's dt.
      model: none
      how_to_use: Called by grain-tables, never by experts. Standardize each source first (standard), build depth labels for all seasons at once, then slot_labels a season at a time. Filter on label_source for chart-listed players only.
      feeds: grain-tables

  - id: grain-tables
    name: Tables at every level of detail
    phase: 0
    status: done
    horizon: now
    depends_on: [cleaning-port, timeline]
    summary: Game, team-game, play, player-play and player-game tables, joined by shared ids, each saved as parts with their own known_at (decision 0008). Player-week is player-game (F1). Season, career and event tables moved to their own ideas.
    interface:
      inputs: raw nflverse copy (scan), cleaning-port standard functions, players_on_play, slot_labels and depth labels, timeline calendar and known-at rules
      outputs: "pcf.data.tables: load(name, at, seasons, parts); build(names, seasons) and `pcf tables build`; write_parts. pcf.data.schemas: TABLES, check_part, check_parts. Tables and parts: game (schedule, pregame, result); team_game (schedule, pregame, result, stats); play (pbp, participation, ftn); player_play (on_field); player_game (roster, game_status, injury, depth, stats, snaps, ff_opportunity, ngs, pfr). Files data/tables/<table>/<part>/season=YYYY/data.parquet."
      grain: game; team-game; play; player-play; player-game
      interval: game, team_game, play 1999 on; player_game 2002 on; player_play 2016-2025; each part its source's years
      cadence: n/a (rebuilt after each data refresh, about 20 seconds)
      known_at: each part has its own; load returns the spine's as known_at and the others' as <part>_known_at
      model: none
      how_to_use: Experts read through the gateway (validation-harness), which wraps load. An empty part column means not known yet or not in that source, never zero. player_game holds the 53-man roster (CEO decision 1A); on_roster and status (2019 on) say who was available, snaps who played.
      feeds: validation-harness, tag-tables, every layer-1 expert

  - id: season-tables
    name: Season and career totals
    phase: 0
    status: idea
    horizon: next
    depends_on: [grain-tables, validation-harness]
    summary: Player-season, team-season and player-career totals, computed in the reader and cut at the moment asked, so a season total is never known before its games (grain-tables brief). Build when the first expert needs them.

  - id: event-tables
    name: Offseason event table
    phase: 0
    status: idea
    horizon: next
    depends_on: [grain-tables, timeline]
    summary: Draft picks, combine results, trades and contracts as dated events with known_at, for the offseason_events experts. Build when the first one needs it.

  - id: tag-tables
    name: Tag tables
    phase: 0
    status: done
    horizon: now
    depends_on: [grain-tables]
    summary: "Football's shared vocabulary as labels on plays, drives, games and players: half statistical (successful, explosive), half commentator lore (hero ball, answer drive, trap game), one versioned rule each, for consistency and for stratifying models. 52 tags and 11 references (docs/TAGS.md), each with its football timing and a rate band. Any project can add to it."
    interface:
      inputs: grain-tables play (pbp), game (result), team_game (pregame), player_game (game_status, injury, stats; the spine's history)
      outputs: "pcf.data.tags: TAGS, REFERENCES, Tag, tags_for(level, part), BEFORE, build_tags(name, seasons), run by `pcf tables build`. pcf.data.tags.check: rates, out_of_band. Parts: play.tags; the drive table (summary, tags); team_game.tags and tags_result; player_game.tags and tags_result. Columns tag_<name> (tag_<name>_v2 for a new version). docs/TAGS.md is generated from the catalog."
      grain: play; drive; team-game; player-game
      interval: each tag's own years (docs/TAGS.md); 1999 on for most play and drive tags
      cadence: n/a (rebuilt with the tables)
      known_at: the part's known_at, the latest of the parts each tag reads (play-by-play; pregame; game status and injuries; results and stats for the tags_result parts)
      model: none
      how_to_use: Only tags whose football timing is before the snap or before the game may describe the row being predicted; the others are outcomes, usable as targets or as features from earlier rows. Empty means does not apply or not covered that year, never no. A new tag needs a rule, a rate band and a test; a changed rule is a new version (CEO decision 2A).
      feeds: every layer-1 expert, validation-harness (the timing check)

  - id: validation-harness
    name: Validation harness
    phase: 0
    status: done
    horizon: now
    depends_on: [package-scaffold, timeline, experiment-tracking]
    summary: "The one way every model is fed, tested and judged: the expert contract, the as_of gateway, prediction moments (the weekly runs), walk-forward backtests, scores and 'beats', signal and no-noise tests, calibration and coverage, leakage checks 1-10 each with a planted leak, sanity rules and the scorecard. pcf backtest <id>."
    interface:
      inputs: grain-tables and tag-tables parts through the gateway; the calendar (timeline); registry.yaml; MLflow (experiment-tracking)
      outputs: "pcf.core.contract (Expert, check_expert, check_output, find); pcf.data.gateway (Gateway, View, TableSource, FrameSource); pcf.data.timeline.moments (RUNS, game_moments, season_moments, event_moments); pcf.validation (splits, backtest, scores, compare, nulls, calibration, leakage, sanity, scorecard, validate, toy). Each validation writes outputs/<id>/<run_id>/history.parquet (standard schema) and scorecard.html, and logs metrics, checks and the scorecard in MLflow."
      grain: any table (a model's grain)
      interval: training from 2006, reported 2016-2024, vault 2025 (config.toml)
      cadence: n/a (serves in_season, retrospective and offseason_events)
      known_at: a view at moment t shows each part's rows with known_at <= t; post-season parts only for finished seasons in season; outputs with as_of <= t
      model: pcf.validation-harness (the toy expert's runs only)
      how_to_use: "Subclass Expert, declare inputs (table: parts; model: version), run and quantity, write features(view, games), target, fit and predict, then pcf backtest <id>. Never read tables directly. Add features_history only for speed; it must match the per-moment features. A new leakage check gets a planted leak and an honest twin in tests/validation/planted.py."
      feeds: every expert, composite and product, through baselines

  - id: baselines
    name: Baselines
    phase: 0
    status: done
    horizon: now
    cadence: [in_season]
    depends_on: [grain-tables, validation-harness]
    summary: "The yardsticks every product must beat, as variants of one project: the last-4-games, season-so-far and last-season averages and a lasso (any scoring), FantasyPros ECR as points, and the no-vig closing line for margins, totals and win probability. ECR beats every box-score baseline (F9)."
    interface:
      inputs: player_game stats and the new ecr part (2021 on); game pregame lines and results
      outputs: "pcf.baselines: RollingAverage, SeasonAverage, LastSeason, Lasso, Ecr, MarketMargin, MarketTotal, MarketWin, VARIANTS, scored(cls, scoring). The player_game ecr part (ecr_rank, ecr_sd, ecr_best, ecr_worst, ecr_position, ecr_scraped). The kickoff moment (benchmarks only). Each validation writes outputs/baselines/<variant>/<run_id>/history.parquet and scorecard.html."
      grain: player-game (fantasy points); game (the market)
      interval: fantasy 2016-2024; ECR 2022-2024, weeks 2-17, Sunday and Monday games; market 2016-2024
      cadence: in_season
      known_at: averages and lasso at the Tuesday run (or the product's run); ECR at the Saturday run; the market at kickoff
      model: none registered (yardsticks; pcf backtest baselines --variant <name>)
      how_to_use: "List them in a product's baselines(), e.g. [Ecr, Lasso, RollingAverage]; the harness reruns them at the product's run (benchmarks at their own) and the scorecard shows beats for each. Another scoring: scored(Lasso, 'half'). Never use a benchmark as a feature before it is known."
      feeds: every product's scorecard; the weekly fantasy product must match ecr, or beat it if it uses ECR (VALIDATION.md §6)

  - id: miss-lenses
    name: Miss lenses
    phase: 0
    status: done
    horizon: now
    depends_on: [baselines, tag-tables]
    summary: "A short, dated list of lenses every player-game model's misses are split by (list of 2026-11-03: position, depth, week; after the game: snap share, team points, margin, QB efficiency), plus at most 5 tags that clear a 99% bar. On every scorecard. Reviewed each season and on each important new model (CEO, 2026-11-03)."
    interface:
      inputs: a player-game walk-forward history with outcomes; player_game roster, depth, snaps, tags, tags_result; team_game tags, tags_result; game schedule, result
      outputs: "pcf.validation.misses (report, lens_frame, from_history, save, Misses, LENSES, LENS_LIST, METHOD). misses.parquet next to each run's history, stamped measured_at, lens_list, method, run_id; the scorecard's Where it misses section; pcf misses <id> [--variant] [--run] writes misses.html."
      grain: player-game
      interval: whatever the model's history covers
      cadence: n/a (runs with every validation)
      known_at: n/a (diagnosis after the fact; lenses never feed a model)
      model: none
      how_to_use: Copy the scorecard's section into RESULTS.md and turn patterns worth chasing into IDEAS.md lines. A new lens list is a new date beside the old one, never an edit.
      feeds: every player-game RESULTS.md; IDEAS.md

  - id: prediction-ledger
    name: Prediction ledger
    phase: 0
    status: validating
    horizon: now
    depends_on: [package-scaffold, validation-harness]
    summary: An append-only record of every prediction made before kickoff, with the market line at that time. It feeds the track record and the scorecards.

  - id: live-experts
    name: Live runs for the finished experts
    phase: 0
    status: building
    horizon: now
    cadence: [in_season]
    depends_on: [prediction-ledger, elo, schemes-v2]
    summary: "The CEO's pick, 2026-11-10: make what we have run every week. The scheduled ledger run (Tue, Thu, Sat) forecasts participation only; this adds Elo (margins, totals, win chances, against the collected lines) and the schemes-v2 trait forecasts, saved before kickoff, so 2026 gives them a live record. No CEO hunches. Exploration 2026-11-10 (go): all nine forecasts already pass through the live path for week 10, about 6 minutes; the GitHub collectors are down since 2026-11-05 (billing lock). Brief agreed 2026-11-10 (1A the nine finals plus free yardsticks, 2A a weeks 1-9 replay, 3A the collectors from this PC while GitHub is locked)."

  - id: registry-tooling
    name: Registry tooling
    phase: 0
    status: idea
    horizon: now
    depends_on: [package-scaffold]
    summary: Validates this file (no missing ids, no cycles, inputs match depends_on), draws the impact map, and generates projects/KNOWLEDGE.md from every RESULTS.md.

  # ---------------------------------------------------------------- Phase 1: experts
  - id: elo
    name: Team Elo (weekly)
    phase: 1
    status: done
    horizon: now
    cadence: [in_season]
    depends_on: [grain-tables, validation-harness]
    summary: Weekly team strength rating in points (margin, offense, defense), with the usual-QB and same-team adjustments and the final-week seed lock. Forecasts margins 0.27 and totals 0.30 points behind the close, win chances 0.019 log loss behind, and wins over the next 3 games and the rest of the season.
    interface:
      inputs: game parts schedule, result; player_game parts roster, snaps, injury (gateway only)
      outputs: "pcf.experts.elo variants, histories in outputs/elo/<variant>/<run_id>/history.parquet: margin (home_margin), total (total_points), win (home_win), wins_next3 and wins_rest (per team-game); mean and q10, q50, q90 (win: mean only). The margin history also carries the ratings (decision 0021): hfa, home_rating, away_rating, home_offense, home_defense, away_offense, away_defense, h_qb, a_qb, h_share, a_share, h_lock, a_lock. Live runs carry them too, in the ledger's elo/margin files (live-experts, 2026-11-10)."
      grain: game; team-game for wins_next3 and wins_rest
      interval: every game from week 1, 2016-2024 reported; ratings carry over, pulled 40% toward average each season
      cadence: in_season
      known_at: the Saturday run, 12:00 Eastern (Thursday noon for Thursday games; decision 0016)
      model: none registered yet (registering needs a logged model; no project has one yet)
      how_to_use: "As a feature and a yardstick, from saved histories only (rule e). It ties the close when blended (F4), so a betting model gains little from it directly; it's a strength summary for other experts and for moments with no line. Ranges for season wins must come from fitted misses, never independent games (F13). The final week is still its weakest (F12, F14)."
      feeds: sides, totals and win products; the prediction ledger; team-efficiency, game script, fantasy game environments, futures

  - id: team-efficiency
    name: Opponent-adjusted efficiency
    phase: 1
    status: idea
    horizon: next
    cadence: [in_season]
    depends_on: [grain-tables, validation-harness]
    summary: "Offense and defense EPA per play adjusted for schedule strength (a free analog of DVOA). The CEO's pick, 2026-11-12. Kickoff 2026-11-12: hunches H40-H44 (EPA and WPA per series; a propensity model for which plays are representative; double machine learning; several grains; the EPA-WPA gap). Draft brief; two open questions (the targets, which propensity)."

  - id: pace
    name: Pace and play-calling
    phase: 1
    status: done
    horizon: next
    cadence: [in_season]
    depends_on: [grain-tables, validation-harness]
    summary: "Neutral pace, pass rate over expected and no-huddle rate, the drivers of fantasy volume. Tests schemes-v2's trait forecasts (pass rate, tempo) and retrospective traits as features (CEO, 2026-11-10). The CEO's pick for the next expert (2026-11-10); hunches H19-H25 recorded and the brief drafted (projects/pace/BRIEF.md); the CEO chose C (habits as features, volume as the forecast). Exploration GO (2026-11-10): every habit is a trait, full-sample clock-aware pace and full-sample PROE are steadier than neutral-only, volume is noisy but forecastable and is mostly plays per drive (efficiency). Brief agreed 2026-11-10, team level only (players: player-pace). Validated and merged 2026-11-11 (CEO approved, spot-check R1 held); the 12 finals are in the weekly ledger. Done 2026-11-11: the CEO called H22 held."
    interface:
      inputs: team_game (schedule, pregame, opening_coach, tendencies, pace); no model outputs
      outputs: "Per team-game, mean q10 q50 q90: next-game plays, dropbacks, runs (<v>_full) and habits pace_oe, proe, proe_1st/_2nd/_3rd, no_huddle (<h>_shrunk). Tables team_game.pace (2002 on) and play.pace (per snap)"
      grain: team_game; play for play.pace
      interval: weekly, Saturday run (Thursday games Thursday), from week 1
      cadence: in_season
      known_at: forecasts at the Saturday run; table parts the day after each game
      model: none registered
      how_to_use: "Features for player volume and fantasy projections; habits are team traits that follow the head coach. Use gaps from the league level, never raw pace_oe before 2010 (pace#B2). No line inside: add it downstream at kickoff (pace#R5)"
      feeds: player-pace, player opportunity, fantasy projections, environment

  - id: player-pace
    name: Player pace and play-calling
    phase: 1
    status: dead_end
    horizon: next
    cadence: [in_season]
    depends_on: [grain-tables, validation-harness]
    summary: "In season: each player's effect on his team's pace over expected and pass rate over expected before each game, from what's known in season (passer and rusher per play, weekly snap counts), as features for team pace and the layers above. Starts with the QB (schemes-v2#F3). The CEO's call (2026-11-10), after team pace. Kickoff 2026-11-11 in projects/player-pace/BRIEF.md; the CEO's hunches H26-H31 (rates by condition, movers, plus-minus and whether it repeats, age, defenders). The CEO's call (2026-11-11): both in season and between seasons, so its retrospective twin is player-pace-retro; one brief, one exploration. Exploration GO (2026-11-11): skill players' pass-rate plus-minus repeats and follows tight ends and receivers (a role tell); QBs carry pace more than PROE; rookie QBs pass less; pace mostly stays with the team. Brief agreed 2026-11-11 (the CEO: 'Build both as drafted'). Validating 2026-11-11: at the team-game grain, the expected starting QB improves next-game PROE a little (0.3%, 4% in expected changes; R2) but not volume (R3, the brief's main test failed); who's out adds nothing (R4). Dead end 2026-11-11 (the CEO: 'keep the results and findings of the in-season expert but discard the model'): the code is removed; RESULTS and player-pace#R2-R6 stay."

  - id: player-pace-retro
    name: Player pace and play-calling (retrospective)
    phase: 1
    status: done
    horizon: next
    cadence: [retrospective]
    depends_on: [grain-tables, validation-harness]
    summary: "Between seasons: each player-season's on-field pace over expected and pass rate over expected, and his plus-minus against his team, from who was on the field on every play (participation, 2016 on), known the day after the Super Bowl; priors for later seasons only (rule m). The CEO's call (2026-11-11): player pace gives downstream models both in-season and between-season features. Shares player-pace's brief and exploration. Validating 2026-11-11: a skill player's pass-rate plus-minus forecasts his next season's 15% better than his position's average (player-pace#R1); defenders 0.8%, QBs none, pace 0.2%. The CEO's spot-check of R1 held (2026-11-11: steady every season, 12.7% beyond playing time). Done and merged 2026-11-11 (the CEO: 'Merge now')."
    interface:
      inputs: player_season.on_field_pace; no model outputs
      outputs: "Per player-season, mean q10 q50 q90 of next season's pm_proe, pm_proe_pers, pm_pace (<m>_shrunk). Tables player_game.on_field_pace and player_season.on_field_pace (2016 on)"
      grain: player_season; player_game for the table part
      interval: once a season
      cadence: retrospective
      known_at: the day after the Super Bowl; for later seasons only (rule m)
      model: none registered
      how_to_use: "A prior for skill players' role (the pass tell, player-pace#R1); not for QBs (no weight) or pace (R7)"
      feeds: player opportunity, fantasy projections, roles

  - id: participation-live
    name: Participation inference (who was on the field, in season)
    phase: 1
    status: done
    horizon: now
    cadence: [in_season]
    depends_on: [grain-tables, validation-harness]
    summary: "Estimates who was on the field on every play of each completed game in the season, offense and defense, from free data known by the morning after (players named in the play-by-play, next-morning snap counts, depth charts, past seasons' participation as the answer key). Two outputs: each possible player's chance of being on each play, and one best-guess lineup per play. For live play-by-play models and each player's in-season importance and value (the CEO, 2026-11-11). Free data only: the paid FTN licence is on hold unless paid data proves necessary to beat the lines. Kickoff 2026-11-11 in projects/participation-live/BRIEF.md; the CEO's hunches H32-H35 (past tendencies, the team's situational substitution, fatigue and consecutive touches, play-to-play sequences). Exploration 2026-11-11 (EXPLORATION.md): GO. H33 held, H32 held small, H34 and H35 held in part; a first reconstruction of 2022-2024 gets 74.6% (offense) and 73.3% (defense) of open-slot players right against 72.8% and 72.2% from snap shares, and the sequence along the drive is the big lever (participation-live#F8). Brief agreed 2026-11-11 (the CEO: map every play's participation). Built 2026-11-12 (RESULTS.md, decision 0030): a per-player sequence model balanced to 11 a play and each snap count beats the snap share by 9.0% / 6.4% log loss and its shuffled self by 5.1-5.5% in every season 2019-2024, calibrated within 1.1 points; the likeliest lineup (the CEO's headline) gets 89% / 83% of each play's 11 right with the right personnel on 63% of plays, and each play carries an honest certainty; plus-minus from the map is noisy (r 0.42-0.50). The CEO's review 2026-11-12: likeliest, no vetoes, the inputs spot-checked (two inputs added, H36-H38 held). Done 2026-11-12: the CEO approved the merge with no vetoes, and asked for a second edition of the map 1-2 weeks after each game (participation-late)."
    interface:
      inputs: play.pbp (situation, named players, no-huddle, drive), player_game (roster, snaps), team_game.pregame (head coach); earlier seasons' player_play.on_field as the answer key (retrospective view, history and training only)
      outputs: "outputs/participation-live/<run_id>/history.parquet: one row per candidate and scrimmage snap, quantity on_field_chance, mean = the chance (q10-q90 equal it), best (snap-matched best guess), likeliest, certainty (the likeliest lineup's expected share right on the play), side, team, n (the team's snap number), as_of, train_end"
      grain: player-play, both sides
      interval: every completed game, 2019-2024 walk-forward (2016-2018 train only)
      cadence: in_season
      known_at: the first weekly run at least a day after kickoff (snap counts are in the morning after)
      model: per position group logistic regression with two snaps of memory, balanced by a max-entropy dual; lineups by linear programs (decision 0030)
      how_to_use: "The lineup to use is likeliest, each play's likeliest 11 (the CEO, 2026-11-12). Use mean (the chance) wherever a measure can take weights; best only when lineups must keep the snap counts. Never treat a lineup as observed: carry the chance or draw lineups, and compare plus-minus within a position group (participation-live#R6). Train only on the walk-forward history (rule e)."
      feeds: in-season player plus-minus and value, context-live and voe-live, routes and roles per play, fantasy usage, the game simulator; later, causal effects per player and play

  - id: participation-late
    name: Participation inference, second edition (1-2 weeks after each game)
    phase: 1
    status: done
    horizon: now
    cadence: [in_season]
    depends_on: [participation-live, grain-tables, validation-harness]
    summary: "A second edition of participation-live's map of who was on the field on every play, run again once FTN's free charting for the game is out (about 1-2 weeks later): the same chances, lineups and per-play certainty, revised with FTN's counts per play (backfield, box, pass rushers). Kept as a later vintage beside the morning-after map. The CEO, 2026-11-12: 'some sort of recalculation that goes back'. Kickoff in projects/participation-late/BRIEF.md; the CEO's hunch H39 (the next game's snap counts) and 'take the lead on this and probably just go for it'. Exploration 2026-11-12 (EXPLORATION.md): GO, small. H39 failed (0.00%); FTN's counts add 0.41% / 0.26% log loss in both held-out seasons. Built 2026-11-12 (RESULTS.md, decision 0031): the morning-after model plus FTN's counts per play, trained on three seasons (FTN marked missing before 2022), beats the morning-after map in 2023 and 2024 by 0.34% / 0.19% log loss and 0.15 / 0.09 points of open spots, calibrated within 1.06 points, certainty honest, point-in-time gap 0; it changes 12.6% of play-sides' likeliest lineup. The CEO's spot-check 2026-11-12: the leakage check, no leak found (0 early FTN rows on 570 games, 12 rebuilds at gap 0, a control that fails as it should). Done 2026-11-12: the CEO approved the merge with no vetoes."
    interface:
      inputs: "everything participation-live reads, plus play.ftn (FTN's charting: backfield, box, pass rushers, blitzers, motion, play action, screens)"
      outputs: "outputs/participation-late/<run_id>/history.parquet: participation-live's schema with model participation-late, model_version late: one row per candidate and scrimmage snap, quantity on_field_chance, mean = the chance (q10-q90 equal it), best, likeliest, certainty, side, team, n, as_of, train_end"
      grain: player-play, both sides
      interval: every completed game, 2023-2024 walk-forward (2022 train only)
      cadence: in_season
      known_at: the first weekly run at least 14 days after kickoff (FTN's known-at); live, the first run after our fetch has the game's FTN rows
      model: participation-live's sequence rung plus FTN's counts as extra inputs (decision 0031)
      how_to_use: "A later edition of participation-live's map: for a game, read the newest edition whose as_of is before your own moment, never the late one earlier (rule c). Otherwise as participation-live: likeliest is the lineup, mean where a measure can take weights. Train only on the walk-forward history (rule e)."
      feeds: the same as participation-live, for uses that can wait two weeks (season plus-minus and value, retrospective models, fantasy usage trends)
