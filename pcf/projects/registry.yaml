  - id: skill-over-expected
    name: Skills over expected (a VOE cousin)
    phase: 1
    status: brief
    horizon: next
    cadence: [retrospective, in_season]  # open: the brief decides; context-live is post-game in-season, participation's who-was-on-the-field is post-season
    depends_on: [context-live, participation-late, voe]
    summary: "The CEO's pick for the next cousin, 2026-11-20 (\"if we go after the lower noise outcome, I think that would be really great. I think it's kind of building on the context expert\"): credit players with actual minus context-live's expected on outcomes with less luck than EPA and closer to one job: pressure over expected (pass rushers and blockers), completion over expected (QBs and receivers), rushing yards over expected (runners; \"Even though that we found that rush yards are pretty hard to model\"). Built on voe's limitations L1 and L4 (projects/voe/BRIEF.md). Uses: player rankings, player-level features, and a per-position map of which measures to use and which to ignore downstream (I79). Causal methods to try on its outcomes: the movers model (I76), double machine learning for rotating players (I77), synthetic control for long absences (I78). Hunch H77 (the CEO, 70% for runners and defensive linemen; Claude 30% for runners). It stays general and feeds line-play and qb-talent (the CEO, 2026-11-20: \"we can keep it more general than the line play and the QB talent, so this can feed into the line play and the QB talent\"). Kickoff after retro 2 (projects/skill-over-expected/BRIEF.md). First look 2026-11-20 (EXPLORATION.md, GO): pass rushers' pressures are the player's (repeat 0.63 to 0.72, movers keep 81 to 97%; sacks 0.35 to 0.40); a lineman's on-field pressure is his line's (movers keep 0%); runners own yards after contact (0.37, kept 78%), the line their yards before contact; QBs' completion over expected 0.41, no better than EPA, partly the team's. H77 held in part. Second look (does it pay?): pressures add +9.4% (DL) and +15.1% (OLB) to next season's sacks beyond past sacks; runners' and QBs' over-expected measures add nothing to yards per carry or completion rate; H77 pays in part. H78 to H83 open for the next look. Third look 2026-11-20 (H78-H83, I89): a receiver's plain catch rate is more his than catches over expected (0.45 against 0.27); outside linebackers are rushers or droppers and the 97% was role (within rushers kept 14%); inside linebackers' role is the scheme's; coverage numbers repeat weakly and travel; sacks per dropback follow the QB (sacks per pressure unclear); time to throw partly the QB's, never the line's; broken tackles and tacklers needed are the runner's; a moving back's share comes from who is left, not how good they are. The CEO, 2026-11-20: H82 meant sacks per dropback (held, flagged as read after the result); merged so far. Fourth look 2026-11-20 (H84): over context-live's back-history expectation (decision 0038), 7 of 14 measures pass either way: a season's situations average out, and the context explains 1 to 9% of these outcomes; only time to throw repeats more (QB 0.70 against 0.64). H84 unclear. Exploration closed by the CEO 2026-11-20 (\"time to throw and adot can be interpreted as strategy rather than pure play outcomes\"); brief agreed 2026-11-20 (a shrunk player-season trait table with owners; the CEO approved the no-noise target: next season's same rate against last season's raw rate, and for pass rushers next season's sacks against past sacks); merge approved (\"yes you may merge\")."

  - id: opportunity-quality
    name: Opportunity quality
    phase: 1
    status: brief
    horizon: next
    cadence: [in_season]
    depends_on: [participation]
    summary: "Expected fantasy points from where targets and carries happen. The CEO's pick, 2026-11-16; hunches H56-H62. Explored 2026-11-16 (GO): knowing a game's actual chances would remove 74% of the error in a player's points, past points 40%; expected points repeat (0.84 week to week), points over expected barely (0.14) with a small lasting part (26% kept season to season); efficiency earns opportunity (+0.94%); goal-line chances are worth the most per chance and add nothing to next game's forecast beyond plain counts; opportunity follows movers in part (0.52 against 0.67); the scheme split fails (projects/opportunity-quality/EXPLORATION.md). Brief agreed 2026-11-16: two main outputs (the regression measure and a forecast of opportunity), methods A and B, tight ends and yards after the catch as inputs, longer horizons in the build; the build runs in its own session."

  - id: snap-leverage
    name: Snap leverage (an investigation and feature engineering)
    phase: 0
    status: done
    horizon: now
    depends_on: [grain-tables]
    summary: "The CEO's pick and sign-off, 2026-11-14: weight every snap each player was on by its leverage (how much the win chance can swing on it, from the situation before the snap: the CEO's 'variance of winning percent added per play based on conditions/situations'), to show which players a team relies on in high-stakes situations, for every position. Main test future playing time; secondary tests next contracts and plus-minus (the CEO). Hunches H45-H49. Draft brief 2026-11-14. Explored 2026-11-14 (GO, small): leverage before the snap works (r 0.54-0.58 with the actual swing); leverage-weighted snap share +0.14% for the next 3 games; the raw trust gap is the passing-down role (pays in contracts, +1.7%); trust beyond the situation is weak (0.12 week to week). H45, H46, H48 unclear; H47 failed; H49 failed (leaning). The CEO's direction (2026-11-14): A, a small expert. Brief agreed 2026-11-14 (\"1c, 2 yes\"): it forecasts leverage share (next 3 games, rest of season) and snap share (next 3 games, the no-noise target); if it fails the no-noise target it becomes an investigation and feature engineering (the CEO). Built 2026-11-14: play.leverage and nine variants (decision 0033). Failed the no-noise target: leverage share makes the next 3 games' snap-share forecast worse (+0.23% range score, every seed worse; RESULTS R1-R3), so by the CEO's rule it became an investigation and feature engineering. The CEO's pick (2026-11-14, \"(a)\"): play.leverage and a post-season part player_game.leverage_usage from true participation stay; the nine forecast variants left the package (decision 0034). The CEO's spot-check (R2, the seeds): leverage share alone is borderline neutral once the seed's luck is counted; the CEO, 2026-11-14: \"(a) It stands\". Done 2026-11-15: no vetoes, merge approved (the CEO)."
    interface:
      inputs: grain-tables play (pbp; pace for the expected pass chance), player_play (on_field, true participation)
      outputs: "play.leverage (wpa_sd, leverage, high_stakes; 2002-2026, known with the play-by-play); player_game.leverage_usage (lev_side, lev_snaps, lev_snap_share, lev_share, lev_hs_share, lev_role_gap, lev_trust_oe; 2016-2025, post-season only); pcf.data.usage (plays, usage, part_rows: the same measures from any on-field chances, such as participation-live's map)"
      grain: play; player-game
      interval: play.leverage 2002 on; leverage_usage 2016 on (participation)
      cadence: "play.leverage: in season (after each game); leverage_usage: retrospective (rule m: in-season models see it only for finished seasons)"
      known_at: play.leverage with the play-by-play (after kickoff); leverage_usage with participation, the day after the Super Bowl
      model: "none (the forecasts failed the no-noise target: RESULTS R1-R3)"
      how_to_use: "Weight plays by their stakes, or pick high-stakes plays before the snap (not the after-the-fact high_leverage tag). The passing-down role gap is a candidate feature for contracts and roles (F10, IDEAS I43). Don't add leverage share beside snap share for playing time: 0.99 alike, and it adds noise (R1-R4)"
      feeds: "none yet; candidates roles-archetypes, contract-motivation, dynasty-values, vacated-opportunity"

